[flake8]
max-line-length = 100
exclude =
    .venv,
    __pycache__,
    migrations,
    .git
per-file-ignores =
    tests/*:S101
    app/__init__.py:F401

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True

[isort]
profile = black
line_length = 100
known_first_party = app

[coverage:run]
source = app
omit =
    app/__init__.py
    */migrations/*

[coverage:report]
fail_under = 75
show_missing = True
