# SonarQube Scanner Configuration
# Used by both Jenkins pipeline and local sonar-scanner runs.

sonar.projectKey=transactbank-api
sonar.projectName=TransactBank API
sonar.projectVersion=2.4.1

# Source and test directories
sonar.sources=app/
sonar.tests=tests/
sonar.python.version=3.11

# Coverage and reports
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.flake8.reportPaths=reports/flake8-report.txt
sonar.python.pylint.reportPaths=reports/pylint-report.txt
sonar.python.bandit.reportPaths=reports/bandit-report.json

# Exclusions
sonar.exclusions=**/__pycache__/**,**/migrations/**,**/.venv/**
sonar.test.exclusions=tests/**

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Encoding
sonar.sourceEncoding=UTF-8
